name: Build static Tremor site
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: static-site-build
  cancel-in-progress: true
jobs:
  build-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build static SPA for GitHub Pages
        run: bun run build
        env:
          GITHUB_ACTIONS: "true"
      - name: Prepare branch deployment files
        run: |
          test -f .output/public/index.html
          rm -rf docs
          mkdir -p docs
          cp -a .output/public/. docs/
          # GitHub Pages uses this as a fallback for client-side routes.
          cp docs/index.html docs/404.html
          touch docs/.nojekyll
      - name: Commit static site to main/docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Static site is already up to date."
            exit 0
          fi
          git commit -m "Build static site for GitHub Pages"
          git push
